<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bulig{% endblock %} · Bulig</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --ink: #1d2433; --muted: #5d6677;
      --line: #dde1e7; --brand: #24405f; --brand-ink: #ffffff;
      --ok-bg: #e5f4ea; --ok-ink: #1d5c33; --err-bg: #fbe9e9; --err-ink: #8a1f1f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    a { color: var(--brand); }
    header { background: var(--brand); color: var(--brand-ink); }
    .bar { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .bar .logo { font-weight: 700; font-size: 1.15rem; color: inherit; text-decoration: none; margin-right: auto; }
    .bar a, .bar button { color: inherit; text-decoration: none; background: none; border: 0; font: inherit; cursor: pointer; padding: 0; }
    .bar a:hover, .bar button:hover { text-decoration: underline; }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    .narrow { max-width: 440px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .msg { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
    .msg.success { background: var(--ok-bg); color: var(--ok-ink); }
    .msg.error { background: var(--err-bg); color: var(--err-ink); }
    form div { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type=text], input[type=email], input[type=password] { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    .helptext { font-size: .85rem; color: var(--muted); }
    .errorlist { list-style: none; padding: 0; margin: 4px 0; color: var(--err-ink); font-size: .9rem; }
    .btn { display: inline-block; background: var(--brand); color: var(--brand-ink); border: 0; padding: 10px 18px; border-radius: 6px; font: inherit; cursor: pointer; text-decoration: none; }
    .btn.secondary { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .stat { font-size: 1.8rem; font-weight: 700; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; }
    dt { font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <nav class="bar" aria-label="Main">
      <a class="logo" href="{% url 'home' %}">Bulig</a>
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:dashboard' %}">Dashboard</a>
        {% block role_nav %}{% endblock %}
        <a href="{% url 'accounts:profile' %}">Profile</a>
        <form method="post" action="{% url 'accounts:logout' %}" style="margin:0">
          {% csrf_token %}
          <button type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">Log in</a>
        <a href="{% url 'accounts:register' %}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in messages %}
      <div class="msg {{ message.tags }}" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
