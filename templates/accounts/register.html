{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>Create a staff account</h1>
  <p class="muted">For teachers, guidance personnel, and school heads. Students do not need an account to submit a report.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <button class="btn" type="submit">Register</button>
  </form>
  <p class="muted">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
</div>
{% endblock %}
