{% extends 'base.html' %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<h1>Edit profile</h1>
<p class="lede">School heads find you by this email, so keep it current.</p>
<section class="panel" style="max-width: 32rem">
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form }}
    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="submit" data-busy-label="Saving…">Save changes</button>
      <a class="btn btn-quiet" href="{% url 'accounts:profile' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
