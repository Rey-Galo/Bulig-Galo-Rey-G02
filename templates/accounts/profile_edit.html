{% extends 'base.html' %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<div class="narrow card">
  <h1>Edit profile</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <button class="btn" type="submit">Save changes</button>
    <a class="btn secondary" href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
</div>
{% endblock %}
