{% extends 'auth_base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<p class="lede">Use the email your school or division registered.</p>
<form method="post" novalidate>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  {{ form }}
  <button class="btn btn-primary w-100" type="submit" data-busy-label="Logging in…">Log in</button>
</form>
<p class="auth-switch">New staff member? <a href="{% url 'accounts:register' %}">Create a staff account</a></p>
{% endblock %}
